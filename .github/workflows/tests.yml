name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ["2026.11.0", "2026.11.1", "2026.11.2"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt "homeassistant==${{ matrix.homeassistant }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
