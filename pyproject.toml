[project]
name = "homeassistant-honeywell-mbus"
version = "0.2.1"
description = "Native async Honeywell wired M-Bus sensors over a TCP serial bridge"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ASYNC"]

[tool.coverage.run]
source = ["custom_components.honeywell_mbus"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
